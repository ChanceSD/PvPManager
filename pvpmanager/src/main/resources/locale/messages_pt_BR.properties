# You can customize these messages to your language, change colors, etc
# You can disable any message by deleting everything after the equals (=)
# Example: Newbie_Protection = (leave this empty)
# You may also use Hex color codes such as &#FFFFFF in MC 1.16+
# There are some variables you can use in this file that work in all messages
# such as {prefix} and some that only work where they make sense such as {player}, {time} and {money}
#
# You can prefix any message with !actionbar or !chat to control where it appears
# - !actionbar = Message shows above hotbar (recommended for frequent spam messages)
# - !chat = Message shows in chat (default if no prefix)
# Example: Item_Cooldown = !actionbar {prefix} &cYou can't use this yet! Available in &e{time}

Prefix = &\#992222&lPvP &\#FF5555➤

# PvP Toggle
PvP_Disabled = {prefix} &aPvP desativado! Agora você está protegido.
PvP_Enabled = {prefix} &cPvP ativado! Agora você pode atacar e ser atacado!
Attack_Denied_You = \!actionbar {prefix} &\#c9453eVocê tem proteção contra PvP!
Attack_Denied_Other = \!actionbar {prefix} &f{player} &\#c9453ehas PvP protection\!
PvP_Force_Enabled_WorldGuard = {prefix} &6PvP ligado por estar dentro de uma região PvP
PvP_Disabled_Fee = {prefix} &aVocê pagou uma taxa de &\#FFD700{money} &apor ter PvP desativado
PvP_Disabled_Fee_Not_Enough = {prefix} &6PvP ativado porque você não possui dinheiro suficiente

# Combat Tag
Tagged_Attacker = {prefix} &7Você atacou &f{player} &7\! Não desconecte ou será punido\!
Tagged_Defender = {prefix} &7Você foi atacado por &f{player} &7\! Não desconecte ou você será punido\!
Out_Of_Combat = {prefix} &aVocê não está mais em combate.
Out_Of_Combat_ActionBar = &aVocê não está mais em combate
Duel_Mode_Protection = \!actionbar {prefix} &\#c9453eEsse jogador está lutando contra outra pessoa!
Command_Denied_InCombat = {prefix} &cComando negado\! Você ainda está em combate\!
Block_Place_Blocked_InCombat = \!actionbar {prefix} &cVocê não pode colocar blocos enquanto estiver em combate!
Block_Break_Blocked_InCombat = \!actionbar {prefix} &cVocê não pode quebrar blocos durante o combate!
Eating_Blocked_InCombat = \!actionbar {prefix} &cComer é bloqueado durante o combate!
Elytra_Blocked_InCombat = \!actionbar {prefix} &cVocê não pode usar uma asa de elytra durante o combate!
Firework_Blocked_InCombat = \!actionbar {prefix} &cVocê não pode usar fogos de artifício enquanto plana em combate!
Firework_Power_Limited_InCombat = \!actionbar {prefix} &cVocê não pode usar fogos de artifício com nível de potência &f{power} &cenquanto estiver em combate!
EnderPearl_Blocked_InCombat = {prefix} &cVocê não pode usar pérolas do fim enquanto estiver em combate\!
ChorusFruit_Blocked_InCombat = {prefix} &cVocê não pode comer frutas do coro enquanto estiver em combate\!
Interact_Blocked_InCombat = \!actionbar {prefix} &cVocê não pode clicar com o botão direito do mouse enquanto estiver em combate!
Teleport_Blocked_InCombat = {prefix} &cVocê não pode se teletransportar enquanto estiver em combate\!
Totem_Blocked_InCombat = {prefix} &cOs totems da imortalidade estão bloqueados em combate\!
Inventory_Blocked_InCombat = \!actionbar {prefix} &cVocê não pode abrir um inventário enquanto estiver em combate!
Pushback_Warning = {prefix} &\#c9453eVocê não pode fugir para zonas de segurança enquanto estiver em combate\!

# Newbie Protection
Newbie_Protection = {prefix} &aBem-vindo\! Você está protegido contra PvP por &a {time}&a minutos
Newbie_Protection_End = {prefix} &6Sua proteção contra PvP acabou\! Agora você pode ser atacado\!
Newbie_Protection_Removed = {prefix} &aVocê removeu sua proteção contra PvP\! Tenha cuidado
Newbie_Protection_On_Hit = {prefix} &\#c9453eVocê tem proteção contra PvP\! Se realmente quer entrar em PvP, remova a proteção com &f/newbie disable
Newbie_Protection_Attacker = \!actionbar {prefix} &f{player} &\#c9453ePossui proteção para iniciantes!
Newbie_Time_Check = {prefix} &7Você está protegido contra PvP por &e{time}
Newbie_Time_Check_Other = {prefix} &f{player} &7is protegido de PvP por outro &e{time}
Newbie_Command_Blocked = {prefix} &cVocê não pode usar este comando enquanto tiver a proteção de novo jogador\!
Newbie_Pickup_Items_Blocked = \!actionbar {prefix} &cVocê não pode coletar itens enquanto tiver a proteção de Novato!
Newbie_Force_Removed_WorldGuard = {prefix} &6Sua nova proteção de jogador foi removida por estar dentro de uma região de PvP

# Respawn Protection
Respawn_Protection = \!actionbar {prefix} &\#c9453eVocê tem proteção contra reaparecimento!
Respawn_Protection_Other = \!actionbar {prefix} &f{player} &\#c9453ePossui proteção contra reaparecimento!

# World Protection
World_Protection = \!actionbar {prefix} &\#c9453eO PvP está desativado neste mundo!

# AFK Protection
AFK_Protection = \!actionbar {prefix} &\#c9453eEste jogador não pode ser atacado enquanto estiver AFK!

# Global Protection
Global_Protection = \!actionbar {prefix} &\#c9453eO combate PvP está desativado globalmente.

# Player Kills
Money_Reward = &aVocê tem &\#FFD700{money} &amoedas por matar o jogador &f{victim} &a\!
Money_Penalty = &cVocê perdeu &\#FFD700{money} &cmoedas por morrer\!
Money_Steal = {prefix} &f{player} &croubou &\#FFD700{money} &cmoedas suas!
Exp_Won = {prefix} &aVocê tem &e{exp} &aexperiência para matar &f{victim}&a\!
Exp_Stolen = {prefix} &f{player} &6roubou &e{exp} &6experiência sua\!

# Kill Abuse
Kill_Abuse_Warning = {prefix} &cVocê será punido se matar este jogador novamente! Por favor, pare.

# Item Cooldown
Item_Cooldown = \!actionbar {prefix} &cVocê ainda não pode usar isso! Disponível em &e{time}

# Commands
Error_Permission = Você não tem permissão\!
Error_Player_Not_Found = &cJogador &f{player} não existe ou está offline\!
Error_Not_Player = Este comando só está disponível para jogadores
# Newbie Command
Error_Not_Newbie = {prefix} &cVocê não é um novo jogador\!
# PvP Command
Error_PvP_Cooldown = {prefix} &cVocê não pode alternar o PvP ainda\! Aguarde &e{time}
Error_PvPToggle_NoPvP = {prefix} &cVocê está impedido de ativar o PvP.
Error_PvPToggle_ForcePvP = {prefix} &cVocê está impedido de desativar o PvP.
PvPToggle_Admin_Changed = {prefix} &aPvP para &f{player} &afoi alterado para &f{state}
PvPToggle_Already_Disabled = {prefix} &cVocê já está com o PvP desativado\!
PvPToggle_Already_Enabled = {prefix} &cVocê já tem o PvP ativado\!
