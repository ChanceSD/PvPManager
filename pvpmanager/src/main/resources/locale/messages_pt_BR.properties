PvPInfo_Header = &\#FFD700▬▬▬▬▬ Player Info\: \#f09a11{player} &\#FFD700▬▬▬▬▬
PvPInfo_UUID = &8├ &7UUID\: &f
PvPInfo_Combat = &8├ &7Combat\: &f
PvPInfo_Protection = &8├ &7Protection\: &f
PvPInfo_World = &8├ &7World\: &f
PvPInfo_Override = &8├ &7Override\: &f
PvPInfo_Enemies = &8├ &7Enemies\: &f
PvPInfo_Exemptions = &8└ &7Exemptions\: &f
PvPInfo_Footer = &\#FFD700▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
# PvPList Command
PvPList_Title = &\#FFD700&l---- Jogadores com PvP ----
PvPList_Enabled = &a&Habilitado
PvPList_Disabled = &c&Desabilitado
PvPList_Nothing_Found = &8Nenhum jogador encontrado
# PvPStatus Command
Other_Status_Enabled = {prefix} &7Player &f{player} &7possui PvP ativado
Others_Status_Disabled = {prefix} &7Player &f{player} &7tem PvP desativado
Self_Status_Disabled = {prefix} &7Você tem o PvP desabilitado
Self_Status_Enabled = {prefix} &7Você tem o PvP habilitado
# Tag Command
Tag_Timeleft = &7Você está em combate por mais &e{time}
Tag_Not_In_Combat = &cVocê atualmente não está em combate

# Variables
Enabled = &cHabilitado
Disabled = &aDesabilitado
# The times below are what will show wherever {time} is used
Time_Days = \ days
Time_Hours = \ hours
Time_Minutes = \ min
Time_Seconds = \ sec
Time_Now = now
