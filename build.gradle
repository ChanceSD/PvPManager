plugins {
    id 'java'
    id 'maven-publish'
}

group = 'me.chancesd.pvpmanager'

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(25))
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain.languageVersion.set(JavaLanguageVersion.of(25))
    }

    repositories {
        mavenCentral()
        mavenLocal()
        maven { url = 'https://hub.spigotmc.org/nexus/content/groups/public/' }
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }
        maven { url = 'https://maven.enginehub.org/repo/' }
        maven { url = 'https://repo.roinujnosde.me/releases/' }
        maven { url = 'https://repo.codemc.org/repository/maven-public' }
        maven { url = 'https://repo.glaremasters.me/repository/towny/' }
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
        maven { url = 'https://repo.william278.net/releases' }
        maven { url = 'https://mvn.lib.co.nz/public/' }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter:5.13.0'
        testImplementation 'org.junit.platform:junit-platform-suite:1.13.0'
        testImplementation 'org.mockito:mockito-core:5.18.0'
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    configurations.matching {
        it.name in ['compileClasspath', 'testCompileClasspath']
    }.configureEach {
        attributes {
            attribute(
                org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
                25
            )
        }
    }
}

publishing {
    repositories {
        maven {
            url = uri('https://repo.codemc.io/repository/maven-releases/')
        }
        maven {
            url = uri('https://repo.codemc.io/repository/maven-snapshots/')
        }
    }
}
